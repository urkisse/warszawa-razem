# Editing panel configuration (Sveltia CMS, compatible with the Decap CMS format).
# Every save in the panel becomes a commit in the GitHub repository; the site is rebuilt and
# republished automatically (see .github/workflows/pages.yml). Docs: https://sveltiacms.app/en/docs
#
# How the pieces fit together:
#  * Only two fields are required: the page address (slug) and the Polish name. Everything else may be
#    left empty; the website then simply leaves that part out (see loadContent() in build.mjs).
#  * "status" (draft / published) and "archived" decide whether a place is on the public site. Drafts
#    and archived places stay in the repository and in this panel, but are not built into the site.
#  * The two collections below ("Active" and "Archived") are two tabs over the same folder, split by
#    the "archived" switch. Archiving = switching "archived" on (in the form, or for many places at once
#    with "Bulk edit" in the list).
#  * Created / edited (who and when) are filled in automatically on every save by the preSave hook in
#    admin/index.html. The full history is also in the repository's commits.

backend:
  name: github
  repo: wyspagithype/warszawa-razem # "owner/repo" of the GitHub repository; change it again if the repository moves
  branch: main

site_url: https://wyspagithype.github.io/warszawa-razem/
display_url: https://wyspagithype.github.io/warszawa-razem/
logo:
  src: ./logo.svg
  show_in_header: true

# New photos are stored next to the existing ones in content/photos/.
media_folder: content/photos
public_folder: content/photos
media_libraries:
  default:
    config:
      max_file_size: 25000000 # 25 MB; videos should be much smaller (see the hint on the Videos field)
      slugify_filename: true
      transformations:
        raster_image:
          width: 1600
          height: 1600
          quality: 82

collections:
  # ------------------------------------------------------------------ tab 1: active places
  - name: places
    label: Aktywne / Active
    label_singular: Miejsce / Place
    description: "Każde miejsce to jedna strona na mapie i w liście. Szkice nie są widoczne na stronie. / Each place is one page, one pin and one card. Drafts are not shown on the site."
    folder: content/places
    extension: json
    format: json
    create: true
    delete: true
    filter: { field: archived, value: [false, null] }
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{pl.name}}"
    thumbnail: photos.0.image
    editor:
      preview: false # the raw-values preview is not a real preview of the site; a wider form is easier to use
    # newest first by default; the Sort menu offers the other fields
    sortable_fields:
      fields: [meta.createdAt, meta.updatedAt, publishedAt, pl.name, slug, status]
      default: { field: meta.createdAt, direction: descending }
    # the table view (the list's default view): the columns asked for by the client
    table_columns: &columns
      - { field: _summary, label: "Nazwa / Name" }
      - { field: status, label: "Status" }
      - { field: "{{publishedAt | date('DD.MM.YYYY HH:mm')}}", label: "Opublikowano / Published at" }
      - { field: "{{meta.createdAt | date('DD.MM.YYYY HH:mm')}}", label: "Utworzono / Created on" }
      - { field: "{{meta.updatedAt | date('DD.MM.YYYY HH:mm')}}", label: "Zmodyfikowano / Modified on" }
      - { field: meta.updatedBy, label: "Edytował / Edited by" }
    # change status / archive many places at once, in one commit
    bulk_edit: { fields: [status, archived] }
    view_filters:
      - { label: "Szkice / Drafts", field: status, pattern: draft }
      - { label: "Opublikowane / Published", field: status, pattern: published }
      - { label: "Integracja / Integration", field: categories, pattern: integration }
      - { label: "Kultura / Culture", field: categories, pattern: culture }
      - { label: "Sport", field: categories, pattern: sport }
      - { label: "Muzyka / Music", field: categories, pattern: music }
      - { label: "Ze znajomymi / With friends", field: categories, pattern: friends }
    fields: &place_fields
      - label: "Adres strony (slug) / Page address"
        name: slug
        widget: string
        pattern: ["^[a-z0-9-]+$", "Tylko małe litery, cyfry i myślniki / Lowercase letters, digits and dashes only"]
        hint: "Część adresu URL, np. hala-koszyki. Nie zmieniaj po publikacji. / Part of the page URL. Do not change after publishing."

      - label: "Status"
        name: status
        widget: select
        default: draft # always has a value (no empty choice), so a place can never be "published by accident"
        options:
          - { label: "Szkic / Draft", value: draft }
          - { label: "Opublikowane / Published", value: published }
        hint: "Szkic jest ukryty na stronie, opublikowane miejsce jest widoczne. Nowe miejsca zaczynają jako szkic; strona odświeża się około minuty po zapisie. / A draft is hidden from the site, a published place is shown. New places start as drafts; the site updates about a minute after saving."

      - label: "Data publikacji / Published on"
        name: publishedAt
        widget: datetime
        required: false
        hint: "Uzupełnia się samo przy pierwszej publikacji; można zmienić. / Filled in automatically when first published; you may change it."

      - label: "Zarchiwizowane / Archived"
        name: archived
        widget: boolean
        required: false
        default: false
        hint: "Ukrywa miejsce na stronie i przenosi je do zakładki Archiwum. Można przywrócić. / Hides the place from the site and moves it to the Archived tab. It can be restored."

      - label: "Kategorie / Categories"
        name: categories
        widget: select
        multiple: true
        required: false
        hint: "Pierwsza kategoria wyznacza kolor pinezki. Bez kategorii miejsce nie pojawi się na mapie. / The first category sets the pin colour. Without a category the place is not shown on the map."
        options:
          - { label: "Integracja / Integration", value: integration }
          - { label: "Wypoczynek kulturalny / Cultural leisure", value: culture }
          - { label: "Wypoczynek sportowy / Sports leisure", value: sport }
          - { label: "Muzyka / Music", value: music }
          - { label: "Rozrywka ze znajomymi / Entertainment with friends", value: friends }

      - label: "Szerokość geograficzna / Latitude"
        name: lat
        widget: number
        value_type: float
        required: false
        min: 51.9
        max: 52.5
        hint: "Np. 52.22216. Bez współrzędnych miejsce nie pojawi się na mapie. W Mapach Google: prawy przycisk myszy na miejscu, kliknij współrzędne. / E.g. 52.22216. Without coordinates the place is not shown on the map. In Google Maps right-click the spot and click the coordinates."

      - label: "Długość geograficzna / Longitude"
        name: lng
        widget: number
        value_type: float
        required: false
        min: 20.6
        max: 21.5
        hint: "Np. 21.01129 / E.g. 21.01129"

      - { label: "Adres / Address", name: address, widget: string, required: false }
      - { label: "Strona internetowa / Website", name: website, widget: string, required: false, hint: "Pełny adres z https:// / Full address starting with https://" }

      - label: "Zdjęcia / Photos"
        name: photos
        widget: list
        required: false
        collapsed: true
        summary: "{{author}} — {{license}}"
        hint: "Pierwsze zdjęcie jest okładką. Pokazywane są trzy pierwsze. Podaj autora i licencję. / The first photo is the cover; the first three are shown. Always credit the author and licence."
        fields:
          - { label: "Plik / Image", name: image, widget: image, required: false }
          - { label: "Autor / Author", name: author, widget: string, required: false }
          - { label: "Licencja / Licence", name: license, widget: string, required: false, hint: "Np. CC BY-SA 4.0, Public domain, © Miasto" }
          - { label: "Adres licencji / Licence URL", name: licenseUrl, widget: string, required: false }
          - { label: "Źródło (adres) / Source URL", name: source, widget: string, required: false }

      - label: "Wideo / Videos"
        name: videos
        widget: list
        required: false
        collapsed: true
        summary: "{{caption}} {{video}}"
        hint: "Opcjonalne. Plik MP4 (H.264), najlepiej do 10 MB (maks. 25 MB), 720p, kilkadziesiąt sekund. Dłuższe filmy: skompresuj lub podaj link. Każdy plik zostaje w historii repozytorium na stałe. Odtwarzacz ma przyciski start/stop, przewijanie, głośność i pełny ekran. / Optional. MP4 (H.264), ideally under 10 MB (max 25 MB), 720p, up to a minute or so. For longer films compress them first. Every uploaded file stays in the repository history for good. The player has play/pause, seeking, volume and fullscreen."
        fields:
          - label: "Plik wideo / Video file"
            name: video
            widget: file
            required: false
            media_folder: /content/videos
            public_folder: /content/videos
            choose_url: false
          - { label: "Okładka / Poster image", name: poster, widget: image, required: false, hint: "Obraz widoczny przed odtworzeniem. Puste = pierwsze zdjęcie miejsca. / Shown before playing. Empty = the place's first photo." }
          - { label: "Opis (PL) / Caption (PL)", name: caption, widget: string, required: false }
          - { label: "Opis (EN) / Caption (EN)", name: captionEn, widget: string, required: false }
          - { label: "Autor / Credit", name: credit, widget: string, required: false, hint: "Autor i licencja materiału. / Author and licence of the footage." }

      - label: "Polski (PL)"
        name: pl
        widget: object
        fields:
          - { label: "Nazwa / Name", name: name, widget: string }
          - &f_summary { label: "Krótki opis (1–2 zdania) / Short summary", name: summary, widget: text, required: false }
          - &f_article
            label: "Artykuł (akapity) / Article (paragraphs)"
            name: article
            widget: list
            required: false
            field: { label: "Akapit / Paragraph", name: paragraph, widget: text, required: false }
          - &f_dohere
            label: "Co tu zrobić / What to do here"
            name: doHere
            widget: list
            required: false
            field: { label: "Punkt / Item", name: item, widget: string, required: false }
          - &f_getthere { label: "Jak dojechać / Getting there", name: getThere, widget: text, required: false }
          - &f_besttime { label: "Kiedy najlepiej / Best time", name: bestTime, widget: string, required: false }
          - &f_tips
            label: "Wskazówki / Tips"
            name: tips
            widget: list
            required: false
            field: { label: "Wskazówka / Tip", name: tip, widget: string, required: false }

      - label: "English (EN)"
        name: en
        widget: object
        required: false # optional block: tick "Add English" to write the English version
        hint: "Opcjonalne. Bez wersji angielskiej strona EN pokazuje tekst polski. / Optional. Without it the English page shows the Polish text."
        fields:
          - { label: "Nazwa / Name", name: name, widget: string, required: false }
          - *f_summary
          - *f_article
          - *f_dohere
          - *f_getthere
          - *f_besttime
          - *f_tips

      # Filled in automatically on every save by the preSave hook in admin/index.html - read-only here.
      - label: "Dodatkowe / Extra – historia zmian / change history"
        name: meta
        widget: object
        required: false
        collapsed: true
        summary: "Utworzono / Created {{createdAt | date('DD.MM.YYYY HH:mm')}} ({{createdBy}}) · Zmieniono / Modified {{updatedAt | date('DD.MM.YYYY HH:mm')}} ({{updatedBy}})"
        hint: "Wypełniane automatycznie przy każdym zapisie. Pełna historia jest w commitach repozytorium. / Filled in automatically on every save. The full history is in the repository's commits."
        fields:
          - { label: "Utworzono / Created on", name: createdAt, widget: datetime, required: false, readonly: true }
          - { label: "Utworzył / Created by", name: createdBy, widget: string, required: false, readonly: true }
          - { label: "Zmodyfikowano / Modified on", name: updatedAt, widget: datetime, required: false, readonly: true }
          - { label: "Edytował / Last edited by", name: updatedBy, widget: string, required: false, readonly: true }

  # ------------------------------------------------------------------ tab 2: archived places
  - name: archive
    label: Archiwum / Archived
    label_singular: Miejsce / Place
    description: "Zarchiwizowane miejsca nie są widoczne na stronie. Aby przywrócić, wyłącz „Zarchiwizowane”. / Archived places are not shown on the site. To restore one, switch “Archived” off."
    folder: content/places
    extension: json
    format: json
    create: false # new places are created in the Active tab
    delete: true
    filter: { field: archived, value: true }
    identifier_field: slug
    slug: "{{slug}}"
    summary: "{{pl.name}}"
    thumbnail: photos.0.image
    editor:
      preview: false
    sortable_fields:
      fields: [meta.updatedAt, meta.createdAt, publishedAt, pl.name, slug, status]
      default: { field: meta.updatedAt, direction: descending }
    table_columns: *columns
    bulk_edit: { fields: [archived] }
    fields: *place_fields

  # ------------------------------------------------------------------ settings: privacy policy details
  - name: settings
    label: Ustawienia / Settings
    files:
      - name: legal
        label: "Polityka prywatności – dane / Privacy policy details"
        file: content/legal.json
        description: "Dane widoczne na stronie Polityka prywatności (stopka). Puste pola są pomijane. / Shown on the Privacy policy page (footer link). Empty fields are left out."
        fields:
          - { label: "Administrator serwisu / Site owner", name: controller, widget: string, required: false, hint: "Nazwa instytucji lub organizacji odpowiedzialnej za stronę. / The organisation responsible for the site." }
          - { label: "Adres / Address", name: address, widget: string, required: false }
          - { label: "E-mail kontaktowy / Contact e-mail", name: email, widget: string, required: false }
          - { label: "Hosting", name: hosting, widget: string, required: false, hint: "Zmień, jeśli strona zostanie przeniesiona na inny serwer. / Change it if the site moves to another host." }
          - { label: "Adres polityki prywatności hostingu / Hosting privacy statement URL", name: hostingPolicyUrl, widget: string, required: false }
          - { label: "Data ostatniej aktualizacji / Last updated", name: updated, widget: string, required: false, hint: "RRRR-MM-DD / YYYY-MM-DD" }
