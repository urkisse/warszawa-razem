<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#faf8fd">
    <title>Panel edycji – Warszawa Razem</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml">
    <link href="./config.yml" type="text/yaml" rel="cms-config-url">
    <!-- Theme: only Sveltia CMS's own colour/font/radius variables are set here (matching the website),
         no internal selectors are overridden, so CMS updates cannot break the layout. -->
    <style>
      html:root[data-theme="light"] {
        --sui-base-hue: 285;
        --sui-primary-accent-color: #7b1fa2;
        --sui-primary-accent-color-light: #9333b8;
        --sui-primary-accent-color-dark: #560b73;
        --sui-primary-accent-color-text: #6a1590;
        --sui-primary-background-color: #faf8fd;
        --sui-secondary-background-color: #f1ecf8;
        --sui-tertiary-background-color: #e6dff2;
        --sui-textbox-background-color: #ffffff;
        --sui-textbox-border-color: #d8d0e6;
        --sui-secondary-foreground-color: #5b5b7e;
        --sui-selected-background-color: #ecdcf5;
        --sui-hover-background-color: #efe7f8;
      }
      html:root {
        --sui-font-family-default: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --sui-control-font-family: var(--sui-font-family-default);
        --sui-heading-font-family: var(--sui-font-family-default);
        --sui-tab-font-family: var(--sui-font-family-default);
        --sui-textbox-font-family: var(--sui-font-family-default);
        --sui-textbox-placeholder-font-family: var(--sui-font-family-default);
        --sui-control-medium-border-radius: 10px;
        --sui-textbox-border-radius: 10px;
        --sui-button-medium-border-radius: 10px;
        --sui-dialog-content-border-radius: 18px;
      }
      body { font-family: var(--sui-font-family-default); }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS: the editing panel. It edits content/places/*.json and content/photos/* in the
         GitHub repository (see admin/config.yml); every save is a commit that republishes the site. -->
    <script src="./sveltia-cms.js"></script>
    <script>
      // On every save: fill in the "Extra" block (created / modified, by whom) and stamp the first
      // publication date. The hook runs for single saves and for bulk edits in the list.
      (function () {
        if (!window.CMS || !CMS.registerEventListener) return;
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var nowLocal = function () {
          var d = new Date();
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        };
        CMS.registerEventListener({
          name: 'preSave',
          handler: function (args) {
            var data = args.entry.get('data');
            var who = (args.author && (args.author.login || args.author.name)) || '';
            var now = nowLocal();
            var meta = data.get('meta');
            if (!meta || typeof meta.set !== 'function') data = data.set('meta', data.clear()); // new place: no "Extra" block yet
            if (!data.getIn(['meta', 'createdAt'])) data = data.setIn(['meta', 'createdAt'], now);
            if (who && !data.getIn(['meta', 'createdBy'])) data = data.setIn(['meta', 'createdBy'], who);
            data = data.setIn(['meta', 'updatedAt'], now);
            if (who) data = data.setIn(['meta', 'updatedBy'], who);
            if (data.get('status') === 'published' && !data.get('publishedAt')) data = data.set('publishedAt', nowLocal());
            return data;
          },
        });
      })();
    </script>
  </body>
</html>
